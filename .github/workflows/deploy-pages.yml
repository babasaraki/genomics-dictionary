name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the entry corpus
        run: python3 tools/validate.py
      - name: Confirm the committed site matches the corpus
        run: |
          python3 tools/build.py
          if ! git diff --quiet; then
            echo "The generated site differs from the committed files."
            echo "Run 'python3 tools/build.py' locally and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

  deploy:
    needs: check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        # Creates the Pages site and sets its source to GitHub Actions if that has
        # not been done in Settings -> Pages. Without this the deploy step fails with
        # "Get Pages site failed" on a repository where Pages was never enabled.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
